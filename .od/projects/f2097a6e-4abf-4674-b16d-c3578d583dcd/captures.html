<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Captures — Voicebox</title>
<style>
:root{
  --bg:#0f1115;
  --surface:#151820;
  --surface-2:#1c1f2a;
  --fg:#e7e9ee;
  --muted:#8a8f9b;
  --border:#2a2f3a;
  --accent:#ff7a3d;
  --accent-2:#b46bff;
  --success:#2dd4a8;
  --warn:#f59e0b;
  --danger:#ef4444;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1220px;margin:0 auto;padding:26px 22px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:32px;height:32px;object-fit:contain}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em}

.nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.nav a{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--fg);text-decoration:none;font-size:13px;font-weight:700}
.nav a:hover{border-color:#3a4250}
.nav a.primary{background:linear-gradient(135deg,rgba(255,122,61,.18),rgba(180,107,255,.18));border-color:#3d2f52}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h2{font-size:16px;font-weight:800;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#0f131a;border:1px solid var(--border);border-radius:12px}
.row + .row{margin-top:10px}
.meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:8px}

.player{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:12px;display:none}
.track{display:flex;align-items:center;gap:12px}
.track button{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:#0d1016;color:var(--fg);font-size:16px;cursor:pointer}
.track progress{flex:1;height:6px;appearance:none;border:none;background:#0d1016;border-radius:999px;overflow:hidden}
.track progress::-webkit-progress-bar{background:#0d1016}
.track progress::-webkit-progress-value{background:linear-gradient(90deg,var(--accent),var(--accent-2))}

.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{border-color:#4a5264}
.btn.primary{background:linear-gradient(135deg,#ff7a3d,#ff5f2f);color:#fff;border-color:transparent}
.btn.danger{background:rgba(239,68,68,.15);color:#ff9494;border-color:#5a2323}
.toast{position:fixed;top:14px;right:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--fg);font-size:13px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transform:translateY(-6px);transition:opacity .15s,transform .15s}
.toast.show{opacity:1;transform:translate(0)}
.empty{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="../app/src/assets/voicebox-logo.png" alt="Voicebox" onerror="this.style.display='none'" />
      <h1>Captures</h1>
    </div>
  </header>
  <nav class="nav">
    <a href="index.html">Overview</a>
    <a href="profiles.html">Profiles</a>
    <a href="clone.html">Clone</a>
    <a href="generate.html">Generate</a>
    <a href="history.html">History</a>
    <a href="captures.html" class="primary">Captures</a>
    <a href="server.html">Server</a>
  </nav>

  <div class="card">
    <h2>Recent captures</h2>
    <div id="capturesList"></div>
  </div>

  <div class="player" id="player">
    <div class="track">
      <button id="playBtn" aria-label="Play">▶</button>
      <progress id="progress" value="0" max="1"></progress>
      <button id="stopBtn" aria-label="Stop">■</button>
    </div>
    <div class="meta" id="playerMeta"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script>
(()=>{
  const base=localStorage.getItem('vb:base')||'http://127.0.0.1:17493';
  const $=id=>document.getElementById(id);
  const toastEl=$('toast');
  let items=[];
  let audio=null, currentAudioUrl=null;

  function toast(msg,dur=1800){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),dur)}
  function esc(s=''){return String(s).replace(/[<>&]/g,c=>({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]))}
  async function get(path){const r=await fetch(base.replace(/\/$/,'')+path,{headers:{'content-type':'application/json'},credentials:'omit'});if(!r.ok) throw new Error('HTTP '+r.status);try{return await r.json();}catch{return r;}}
  async function del(path){const r=await fetch(base.replace(/\/$/,'')+path,{method:'DELETE',credentials:'omit'});if(!r.ok) throw new Error('HTTP '+r.status);}

  function togglePlayer(url,label){
    const player=$('player');
    if(currentAudioUrl===url){ player.style.display='none'; currentAudioUrl=null; if(audio){audio.pause();audio=null;} return; }
    player.style.display='block';
    if(audio){audio.pause();}
    audio=new Audio(url);
    audio.onended=()=>{ currentAudioUrl=null; player.style.display='none'; };
    audio.ontimeupdate=()=>{$('progress').value=audio.currentTime/(audio.duration||1);};
    currentAudioUrl=url;
    $('playerMeta').textContent=(label||'Audio')+' · now playing';
    audio.play().catch(()=>toast('Playback blocked'));
  }

  async function loadCaptures(){
    try{
      const data=await get('/api/captures');
      items=Array.isArray(data)?data:[];
      if(!items.length){ $('capturesList').innerHTML='<div class="empty">No captures yet.</div>'; return; }
      $('capturesList').innerHTML=items.map(c=>{
        const meta=[c.duration_seconds?c.duration_seconds+'s':'',c.source||''].filter(Boolean).join(' · ');
        return '<div class="row"><div><div style="font-weight:700;font-size:14px">'+esc(c.name||c.id)+'</div>'
        +'<div class="meta">'+esc(meta)+'</div></div>'
        +'<div class="actions"><button class="btn" data-act="play" data-id="'+esc(c.id)+'">Play</button>'
        +'<button class="btn danger" data-act="del" data-id="'+esc(c.id)+'">Delete</button></div></div>';
      }).join('');
      $('capturesList').querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('click',async()=>{
        const id=b.dataset.id, act=b.dataset.act;
        if(act==='play'){
          try{ togglePlayer(base.replace(/\/$/,'')+'/api/captures/'+encodeURIComponent(id)+'/audio', 'Capture '+id); }
          catch(e){ toast('Playback failed: '+e.message); }
        }else if(act==='del'){
          if(!confirm('Delete this capture?')) return;
          try{ await del('/api/captures/'+encodeURIComponent(id)); await loadCaptures(); toast('Deleted'); }catch(e){ toast('Delete failed: '+e.message); }
        }
      }));
    }catch{ $('capturesList').innerHTML='<div class="empty">Cannot reach backend.</div>'; }
  }

  (async()=>await loadCaptures())();
})();
</script>
</body>
</html>
