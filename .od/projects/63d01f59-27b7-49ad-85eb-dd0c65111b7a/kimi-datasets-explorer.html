                        { label: "Teal", value: "#0d9488" }
                      ].map((color) => (
                        <button
                          key={color.value}
                          onClick={() => setTweakBrandColor(color.value)}
                          style={{ backgroundColor: color.value }}
                          className={`w-6 h-6 rounded-full border-2 transition ${tweakBrandColor === color.value ? 'border-[var(--fg)] scale-110' : 'border-transparent'}`}
                          title={color.label}
                        />
                      ))}
                    </div>
                  </div>

                  {/* Font sizing slider */}
                  <div>
                    <div className="flex justify-between">
                      <label className="text-[10px] text-[var(--muted)] all-caps-label font-bold">Base Font Scale</label>
                      <span className="font-mono text-brand font-bold">{tweakFontSize}px</span>
                    </div>
                    <input 
                      type="range"
                      min="12"
                      max="16"
                      value={tweakFontSize}
                      onChange={(e) => setTweakFontSize(parseInt(e.target.value))}
                      className="w-full mt-1.5 accent-brand"
                    />
                  </div>

                  {/* Simulation latency slider */}
                  <div>
                    <div className="flex justify-between">
                      <label className="text-[10px] text-[var(--muted)] all-caps-label font-bold">Swarm Extraction speed</label>
                      <span className="font-mono text-brand font-bold">{tweakAgentSpeed}x</span>
                    </div>
                    <input 
                      type="range"
                      min="1"
                      max="4"
                      value={tweakAgentSpeed}
                      onChange={(e) => setTweakAgentSpeed(parseInt(e.target.value))}
                      className="w-full mt-1.5 accent-brand"
                    />
                  </div>

                </div>
              </div>
            )}

          </main>

        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
